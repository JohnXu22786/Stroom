name: stroom
description: A Flutter app combining FlClash UI architecture with camera functionality.
publish_to: "none"
version: 0.5.0

environment:
  sdk: ">=3.13.7 <4.0.0"
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter

  # FlClash Architecture Dependencies
  flutter_riverpod: ^3.4.3
  dynamic_color: ^2.1.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Camera/Photo Functionality Dependencies
  image_picker: ^1.2.4
  wechat_assets_picker: ^10.1.3
  path_provider: ^2.1.6
  path_provider_platform_interface: ^2.1.3
  path: ^1.9.1

  # TTS Functionality Dependencies
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  # 2.5.2+ includes the R8 keep rules needed by the Android JNI implementation.
  shared_preferences_android: ^2.5.3
  flutter_secure_storage: ^10.3.4
  http: ^1.5.0
  file_picker: ^13.1.0
  permission_handler: ^13.0.2
  just_audio: ^0.10.6
  uuid: ^4.6.0
  chewie: ^1.17.4
  video_player: ^2.14.1
  fvp: ^0.39.1
  # media_kit 已移除，播放器替换为 chewie + fvp
  crypto: ^3.0.7
  html: ^0.15.7
  unorm_dart: ^0.3.3
  cross_platform_video_thumbnails: ^0.1.1
  # 移动端（Android/iOS）缩略图原生实现：cross_platform_video_thumbnails
  # 未注册移动端原生插件，移动端改用 get_thumbnail_video（系统 API 取帧）。
  get_thumbnail_video: ^0.7.3
  mime: ^2.1.0
  sqflite: ^2.4.5
  audio_waveforms: ^2.0.2

  # Chat UI
  flutter_chat_ui: ^2.12.0
  flutter_chat_core: ^2.9.1
  markdown_widget: ^2.3.2+8
  flutter_highlight: ^0.7.0

  flutter_inappwebview: ^6.1.5
  pointer_interceptor: ^0.10.1+3

  # Image Editor
  pro_image_editor: ^14.19.0

  # Extended Image Viewer (replaces InteractiveViewer + custom Image.memory)
  extended_image: ^10.1.0
  # Pure-Dart image codec for lossless(-ish) compression of chat attachments
  image: ^4.12.0

  # SVG support
  flutter_svg: ^2.3.0

  # Photo View for SVG gesture handling
  photo_view: ^0.15.0

  # Shared 2D/3D math feature, published on pub.dev.
  visual_math: ^0.1.0

  # UI and Utilities
  cupertino_icons: ^1.0.9
  characters: ^1.4.1
  idb_shim: ^2.10.1+1
  archive: ^4.5.2
  # 桌面平台磁盘剩余空间查询（dart:ffi 辅助库）
  ffi: ^2.2.0
  url_launcher: ^6.3.3
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.1
  flutter_local_notifications: ^22.3.2
  file_selector: ^1.1.0

  # Desktop: 窗口管理 + 系统托盘（关闭窗口时最小化到托盘/后台）
  window_manager: ^0.5.2
  tray_manager: ^0.8.0
  flutter_math_fork: ^0.7.4
  markdown: ^7.3.1
  protobuf: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  # Mocking for unit tests (pure Dart, no code generation).
  mocktail: ^1.0.5
  flutter_background_service_platform_interface: ^5.1.2
  fake_async: ^1.3.3
  # Simulate a rejected on-disk conversation write in flow recovery tests.
  shared_preferences_platform_interface: ^2.4.2
  # Used by tests to disable visibility_detector's debounce timer
  # (transitive via flutter_chat_ui, but must be declared to import it).
  visibility_detector: ^0.4.0+2
  cross_file: ^0.3.5+5
  file_picker_platform_interface: ^4.2.0
  # Math editor compatibility tests compare against the evaluator function set.
  function_tree: ^0.9.1
  # Run collection sync integration tests against real SQLite transactions.
  sqflite_common_ffi: ^2.4.4

dependency_overrides:
  # Newer AVFoundation plugin releases use an isolation argument unavailable in
  # the Xcode SDK used by the macOS and iOS release runners.
  video_player_avfoundation: 2.12.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  assets:
    - assets/images/
    - assets/vendor/
    - assets/vendor/native/
    - assets/vendor/mermaid/
    - web/data_integrity_json_worker.js

  generate: true
