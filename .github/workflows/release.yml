name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.extract-version.outputs.app_version }}
      release_time: ${{ steps.build-info.outputs.release_time }}
    steps:
      - id: extract-version
        run: |
          TAG="${{ env.TAG }}"
          echo "app_version=$TAG" >> "$GITHUB_OUTPUT"

      # 构建信息：发布时间 + 更新内容，写入应用「版本信息」面板。
      # - release 事件：取自 GitHub Release 的发布时间与 Release 说明。
      # - workflow_dispatch：优先取该 tag 对应 release 的真实发布时间
      #   与说明 —— 重建旧 tag 时，用户安装的仍是该 release 的发布时间点，
      #   晚于它的发布才算新版本；tag 不存在（如按分支手动构建）时回退到
      #   当前 UTC 时间、无更新内容。
      # 更新内容经 Base64 编码后写入 JSON 文件，避免换行/特殊字符破坏
      # 命令行，也避免 Windows 命令行长度限制截断更新内容。
      - id: build-info
        run: |
          RELEASE_NOTES_FILE="$RUNNER_TEMP/release-notes.txt"
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TIME="$(jq -r '.release.published_at // empty' "$GITHUB_EVENT_PATH")"
            jq -j '.release.body // ""' "$GITHUB_EVENT_PATH" > "$RELEASE_NOTES_FILE"
          else
            RELEASE_TIME="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" -q '.published_at // empty' 2>/dev/null || true)"
            if [ -z "$RELEASE_TIME" ]; then
              RELEASE_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              : > "$RELEASE_NOTES_FILE"
            else
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null \
                | jq -j '.body // ""' > "$RELEASE_NOTES_FILE" || true
            fi
          fi
          echo "release_time=$RELEASE_TIME" >> "$GITHUB_OUTPUT"
          python3 - "$GITHUB_WORKSPACE/build-info.json" "$TAG" "$RELEASE_TIME" "$RELEASE_NOTES_FILE" <<'PY'
          import base64
          import json
          import pathlib
          import sys

          output, version, release_time, notes_path = sys.argv[1:]
          build_info = {
              "APP_VERSION": version,
              "APP_RELEASE_TIME": release_time,
              "APP_RELEASE_NOTES_B64": base64.b64encode(
                  pathlib.Path(notes_path).read_bytes()
              ).decode("ascii"),
          }
          pathlib.Path(output).write_text(json.dumps(build_info), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-info
          path: build-info.json
          retention-days: 1
          if-no-files-found: error

  windows:
    needs: prepare-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-build-info
      - uses: subosito/flutter-action@v2
        with:
          # Keep release builds on the same exact SDK as the checked-in lockfile.
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --dart-define-from-file=build-info.json
      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = "${{ needs.prepare-version.outputs.app_version }}"
          (Get-Content "windows\installer.iss") -replace '0\.2\.14', $version | Set-Content "windows\installer.iss"
          choco install innosetup --no-progress -y
          mkdir artifacts -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\installer.iss"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/stroom-windows-x64-installer-*.exe



  # Builds native arm64 binary on Apple Silicon (ARM64) runner.
  macos-arm64:
    needs: prepare-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-build-info
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - run: flutter create --platforms=macos .
      - run: flutter pub get --enforce-lockfile
      - name: Clean SwiftPM cache and artifacts
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          # Remove stale binary artifacts that cause SwiftPM "already exists" errors
          # (e.g. mdk-sdk from fvp package — known SwiftPM bug Apple FB10471859)
          find ~/Library/Caches/org.swift.swiftpm -name "*.zip" -delete 2>/dev/null || true
      - name: Configure CocoaPods
        run: |
          pod repo add trunk https://github.com/CocoaPods/Specs.git 2>/dev/null || true
      - name: Build macOS arm64
        run: flutter build macos --release --dart-define-from-file=build-info.json
        env:
          FLUTTER_XCODE_ARCHS: arm64
      - name: Create macOS arm64 archive
        shell: bash
        run: |
          cd build/macos/Build/Products/Release
          # 只打包 stroom.app，排除 dSYM、XCFrameworkIntermediates 等构建中间产物
          # （否则产物约 340MB，其中近一半是调试符号，其余是 app 外的框架副本）。
          # 1. mdk-sdk 的二进制是 x86_64+arm64 通用二进制，裁剪到目标架构
          ARCH=arm64
          THINNED=0
          for bin in "stroom.app/Contents/Frameworks/mdk.framework/Versions/A/"*.dylib \
                     "stroom.app/Contents/Frameworks/mdk.framework/Versions/A/mdk"; do
            [ -e "$bin" ] || continue
            if lipo -info "$bin" | grep -q "Architectures in the fat file"; then
              lipo -thin "$ARCH" -output "$bin.thin" "$bin" && mv "$bin.thin" "$bin" || {
                echo "WARNING: could not thin $bin for $ARCH" >&2
                continue
              }
              THINNED=$((THINNED+1))
            fi
          done
          if [ "$THINNED" -eq 0 ]; then
            echo "WARNING: no mdk binaries were thinned (mdk.framework layout may have changed)" >&2
          fi
          # 2. lipo 修改了二进制，重新签名（CI 为 ad-hoc 签名）。
          #    第一遍：为所有嵌套代码签名（不带 entitlements）；
          #    第二遍：为主二进制签名并带上沙盒 entitlements
          #    （复用仓库签入的 Release.entitlements，Xcode 构建时用的就是它）
          codesign --force --deep --sign - "stroom.app"
          codesign --force --sign - \
            --entitlements "$GITHUB_WORKSPACE/macos/Runner/Release.entitlements" "stroom.app"
          # 3. ditto 打包时保留 framework 的符号链接/硬链接
          #    （zip -r 会把链接展开成多份重复二进制，白白多出 ~40MB）
          ditto -c -k --keepParent "stroom.app" "$GITHUB_WORKSPACE/stroom-macos-arm64-release-$TAG.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: stroom-macos-arm64-release-*.zip

  # x86_64 is cross-compiled on ARM64 via Xcode cross-compilation.
  # GitHub no longer provides Intel macOS runners (macos-13 removed).
  macos-x64:
    needs: prepare-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-build-info
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - run: flutter create --platforms=macos .
      - run: flutter pub get --enforce-lockfile
      - name: Clean SwiftPM cache and artifacts
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          # Remove stale binary artifacts that cause SwiftPM "already exists" errors
          # (e.g. mdk-sdk from fvp package — known SwiftPM bug Apple FB10471859)
          find ~/Library/Caches/org.swift.swiftpm -name "*.zip" -delete 2>/dev/null || true
      - name: Configure CocoaPods
        run: |
          pod repo add trunk https://github.com/CocoaPods/Specs.git 2>/dev/null || true
      - name: Build macOS x64
        run: flutter build macos --release --dart-define-from-file=build-info.json
        env:
          FLUTTER_XCODE_ARCHS: x86_64
      - name: Create macOS x64 archive
        shell: bash
        run: |
          cd build/macos/Build/Products/Release
          # 只打包 stroom.app，排除 dSYM、XCFrameworkIntermediates 等构建中间产物
          # （否则产物约 340MB，其中近一半是调试符号，其余是 app 外的框架副本）。
          # 1. mdk-sdk 的二进制是 x86_64+arm64 通用二进制，裁剪到目标架构
          ARCH=x86_64
          THINNED=0
          for bin in "stroom.app/Contents/Frameworks/mdk.framework/Versions/A/"*.dylib \
                     "stroom.app/Contents/Frameworks/mdk.framework/Versions/A/mdk"; do
            [ -e "$bin" ] || continue
            if lipo -info "$bin" | grep -q "Architectures in the fat file"; then
              lipo -thin "$ARCH" -output "$bin.thin" "$bin" && mv "$bin.thin" "$bin" || {
                echo "WARNING: could not thin $bin for $ARCH" >&2
                continue
              }
              THINNED=$((THINNED+1))
            fi
          done
          if [ "$THINNED" -eq 0 ]; then
            echo "WARNING: no mdk binaries were thinned (mdk.framework layout may have changed)" >&2
          fi
          # 2. lipo 修改了二进制，重新签名（CI 为 ad-hoc 签名）。
          #    第一遍：为所有嵌套代码签名（不带 entitlements）；
          #    第二遍：为主二进制签名并带上沙盒 entitlements
          #    （复用仓库签入的 Release.entitlements，Xcode 构建时用的就是它）
          codesign --force --deep --sign - "stroom.app"
          codesign --force --sign - \
            --entitlements "$GITHUB_WORKSPACE/macos/Runner/Release.entitlements" "stroom.app"
          # 3. ditto 打包时保留 framework 的符号链接/硬链接
          #    （zip -r 会把链接展开成多份重复二进制，白白多出 ~40MB）
          ditto -c -k --keepParent "stroom.app" "$GITHUB_WORKSPACE/stroom-macos-x64-release-$TAG.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: stroom-macos-x64-release-*.zip

  linux:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-build-info
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libayatana-appindicator3-dev
      - run: flutter create --platforms=linux .
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release --dart-define-from-file=build-info.json
      - name: Create Linux archive
        run: |
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/stroom-linux-x64-release-$TAG.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: stroom-linux-x64-release-*.zip

  web:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-build-info
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --release --dart-define-from-file=build-info.json
      - name: Create Web archive
        run: |
          cd build/web
          zip -r "$GITHUB_WORKSPACE/stroom-web-release-$TAG.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: stroom-web-release-*.zip

  ios:
    needs: prepare-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-build-info
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - run: flutter create --platforms=ios .
      - run: flutter pub get --enforce-lockfile
      - name: Clean SwiftPM cache and artifacts
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          # Remove stale binary artifacts that cause SwiftPM "already exists" errors
          # (e.g. mdk-sdk from fvp package — known SwiftPM bug Apple FB10471859)
          find ~/Library/Caches/org.swift.swiftpm -name "*.zip" -delete 2>/dev/null || true
      - name: Configure CocoaPods
        run: |
          pod repo add trunk https://github.com/CocoaPods/Specs.git 2>/dev/null || true
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define-from-file=build-info.json
      - name: Create unsigned IPA (Payload/Runner.app → zip)
        run: |
          TAG="${{ env.TAG }}"
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r "$GITHUB_WORKSPACE/stroom-ios-unsigned-$TAG.ipa" Payload/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: stroom-ios-unsigned-*.ipa

  android:
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-build-info
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - run: flutter pub get --enforce-lockfile
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 -d > ${{ runner.temp }}/keystore.jks
      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --dart-define-from-file=build-info.json
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "stroom-android-release-$TAG.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: stroom-android-release-*.apk
