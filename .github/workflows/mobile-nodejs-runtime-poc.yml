name: Mobile Node MCP POC

on:
  push:
    branches:
      - poc/mobile-nodejs-runtime-ci
    paths:
      - .github/workflows/mobile-nodejs-runtime-poc.yml
      - tools/mobile-runtime-poc/**

permissions:
  contents: read

jobs:
  node-mcp-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Stroom POC scripts
        uses: actions/checkout@v4

      - name: Check out nodejs-mobile v18.20.4
        uses: actions/checkout@v4
        with:
          repository: nodejs-mobile/nodejs-mobile
          ref: v18.20.4
          path: nodejs-mobile

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platforms;android-26' \
            'build-tools;30.0.2' \
            'ndk;27.2.12479018' \
            'cmake;3.10.2.4988404'

      - name: Set up Java 11 for upstream Gradle 6.7.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Prepare official Node library and POC fixtures
        run: |
          curl --fail --location --retry 2 \
            https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip \
            --output "$RUNNER_TEMP/nodejs-mobile-android.zip"
          printf '%s  %s\n' \
            bd7321eaa1a7602fbe0bb87302df2d79d87835cf4363fbdd17c350dbb485c2af \
            "$RUNNER_TEMP/nodejs-mobile-android.zip" | sha256sum --check
          mkdir -p nodejs-mobile/out_android/x86_64
          unzip -p "$RUNNER_TEMP/nodejs-mobile-android.zip" bin/x86_64/libnode.so \
            > nodejs-mobile/out_android/x86_64/libnode.so
          cp tools/mobile-runtime-poc/runtime-check.cjs nodejs-mobile/test/runtime-check.cjs
          cp tools/mobile-runtime-poc/mcp-stdio-roundtrip.cjs nodejs-mobile/test/mcp-stdio-roundtrip.cjs

      - name: Build upstream Android sample app
        working-directory: nodejs-mobile/tools/mobile-test/android/testnode
        run: ./gradlew --no-daemon assembleDebug

      - name: Run npm and MCP runtime checks on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install nodejs-mobile/tools/mobile-test/android/testnode/app/build/outputs/apk/debug/app-debug.apk
            cp tools/mobile-runtime-poc/run-nodejs-mobile.sh "$RUNNER_TEMP/run-nodejs-mobile.sh"
            chmod +x "$RUNNER_TEMP/run-nodejs-mobile.sh"
            "$RUNNER_TEMP/run-nodejs-mobile.sh"
