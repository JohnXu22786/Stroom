name: CI Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  # Keep metadata-only edits out of the code workflow's pending slot. This
  # preserves a queued run for a commit or base-branch retarget.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'code' }}
  # A title/body-only edit gets its own short validation workflow and must not
  # cancel a code run. Retargeting a PR changes `changes.base` and still
  # cancels the prior run so the new base is checked.
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}

jobs:
  # Small JavaScript checks for the integrated components share one Node job.
  components:
    name: "${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'PR metadata edit (component scripts skipped)' || 'Component Integration scripts' }}"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/math_editor_test/package-lock.json
      - run: npm ci --prefix tools/math_editor_test
      - run: npm test --prefix tools/math_editor_test
      - run: node --test tests/widgets/mermaid_render_widget_js_test.cjs
      - run: node --test tests/catcatch/js_hook_script_test.cjs

  format:
    name: "${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'PR metadata edit (format skipped)' || 'Format Check' }}"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        # Preserve the repo's Dart 3.0 formatting baseline after raising its SDK minimum.
        run: dart format --language-version=3.0 --set-exit-if-changed .
      - name: Show Dart formatting diff
        if: failure()
        run: |
          dart format --language-version=3.0 \
            lib/pages/chat/dialogs/mermaid_preview_web_controls_web.dart \
            tests/pages/chat/dialogs/mermaid_preview_dialog_web_controls_test_dom_web.dart \
            tests/pages/chat/dialogs/mermaid_preview_dialog_zoom_test.dart
          git --no-pager diff -- \
            lib/pages/chat/dialogs/mermaid_preview_web_controls_web.dart \
            tests/pages/chat/dialogs/mermaid_preview_dialog_web_controls_test_dom_web.dart \
            tests/pages/chat/dialogs/mermaid_preview_dialog_zoom_test.dart

  # Keep the required branch-protection check name for static analysis.
  quality:
    # The prior Static Analysis result remains attached to the unchanged head
    # SHA during metadata-only edits; base retargets use this formal name.
    name: "${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'PR metadata edit (code checks skipped)' || 'Static Analysis' }}"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Run Dart analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Check changed files have tests
        run: |
          EVENT_BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$EVENT_BASE_SHA" ]; then
            echo "Not a PR — skipping diff coverage check."
            exit 0
          fi
          echo "### Changed lib/ files vs tests/ coverage ###"
          echo ""
          UNCOVERED=0
          # Pull request refs are normally merge commits. Their first parent
          # is the exact base used to build the ref, even when main advances
          # after the event payload was created. Use it to exclude upstream
          # changes; fall back to a merge-base for a plain head checkout or a
          # feature branch whose own history happens to contain a merge.
          PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if SECOND_PARENT_SHA="$(git rev-parse --verify HEAD^2 2>/dev/null)" && [ "$SECOND_PARENT_SHA" = "$PR_HEAD_SHA" ]; then
            if ! DIFF_BASE_SHA="$(git rev-parse HEAD^1)"; then
              echo "Unable to determine the merge ref base."
              exit 1
            fi
          elif ! DIFF_BASE_SHA="$(git merge-base "$EVENT_BASE_SHA" HEAD)"; then
            echo "Unable to determine the merge base against $EVENT_BASE_SHA."
            exit 1
          fi
          if ! CHANGED_LIB_FILES="$(git diff --diff-filter=ACMRT --name-only "$DIFF_BASE_SHA" HEAD -- 'lib/*.dart' 'lib/**/*.dart')"; then
            echo "Unable to determine changed lib files against $DIFF_BASE_SHA."
            exit 1
          fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              lib/catcatch/engine/js_hook_script.dart)
                test_f="tests/catcatch/js_hook_script_test.cjs"
                ;;
              lib/services/startup_preferences.dart)
                test_f="tests/startup/startup_check_service_web.dart"
                ;;
              lib/services/data_integrity_json_parser_web.dart)
                test_f="tests/startup/startup_check_service_web.dart"
                ;;
              lib/pages/chat/dialogs/mermaid_preview_web_controls.dart|\
              lib/pages/chat/dialogs/mermaid_preview_web_controls_stub.dart|\
              lib/pages/chat/dialogs/mermaid_preview_web_controls_web.dart)
                test_f="tests/pages/chat/dialogs/mermaid_preview_dialog_zoom_test.dart"
                ;;
              *)
                test_f="tests/${file#lib/}"
                test_f="${test_f%.dart}_test.dart"
                ;;
            esac
            if [ -f "$test_f" ]; then
              echo "  ✅ $file"
            else
              # Tests are sometimes grouped in a sub-directory of the mapped
              # path (e.g. tests/pages/<subdir>/x_test.dart). Look one level deep.
              dir=$(dirname "$test_f")
              base=$(basename "$test_f")
              if compgen -G "$dir/*/$base" >/dev/null; then
                echo "  ✅ $file ($(compgen -G "$dir/*/$base" | head -1))"
              else
                # Older tests were flattened while their source files stayed
                # in feature directories (for example lib/models/assistant.dart
                # is covered by tests/assistant_test.dart). Accept that layout
                # only when the basename identifies exactly one test file;
                # ambiguous names must be added to the explicit map above.
                if [[ "$base" == *_test.dart ]]; then
                  stem="${base%_test.dart}"
                  mapfile -t flattened < <(
                    find tests -type f -name "${stem}_test.dart" -print
                  )
                else
                  # Non-Dart tests are accepted only by an explicit source map.
                  flattened=()
                fi
                if [ "${#flattened[@]}" -eq 1 ]; then
                  echo "  ✅ $file (${flattened[0]})"
                else
                  # Grouped or renamed tests may not share the source basename.
                  # A package import is explicit evidence that the test covers
                  # this source file, so accept all matching test files.
                  source_import="package:stroom/${file#lib/}"
                  mapfile -t imported_tests < <(
                  grep -RIlF --include='*_test.dart' --include='*_test.cjs' -- "$source_import" tests || true
                  )
                  if [ "${#imported_tests[@]}" -gt 0 ]; then
                    echo "  ✅ $file (imported by ${imported_tests[*]})"
                  else
                    # Dart parts are compiled through their parent library and
                    # therefore have no direct package import in test files.
                    part_of=$(sed -nE "s/^part of ['\"]([^'\"]+)['\"];$/\1/p" "$file" | head -1)
                    if [ -n "$part_of" ]; then
                      source_dir=$(dirname "${file#lib/}")
                      if [ "$source_dir" = "." ]; then
                        parent_import="package:stroom/$part_of"
                      else
                        parent_import="package:stroom/$source_dir/$part_of"
                      fi
                      mapfile -t parent_tests < <(
                        grep -RIlF --include='*_test.dart' --include='*_test.cjs' -- "$parent_import" tests || true
                      )
                    else
                      parent_tests=()
                    fi
                    if [ "${#parent_tests[@]}" -gt 0 ]; then
                      echo "  ✅ $file (parent library imported by ${parent_tests[*]})"
                    else
                      echo "  ⚠️  $file → missing $test_f"
                      if [ "${#flattened[@]}" -gt 1 ]; then
                        printf '      Ambiguous basename matches: %s\n' "${flattened[*]}"
                      fi
                      UNCOVERED=1
                    fi
                  fi
                fi
              fi
            fi
          done <<< "$CHANGED_LIB_FILES"
          echo ""
          if [ "$UNCOVERED" -eq 0 ]; then
            echo "All changed files have matching tests. (But check that existing tests cover new logic.)"
          else
            echo "Some changed files lack matching tests. Add a test file or update the mapping for the test that covers it."
            exit 1
          fi

  # KeepAliveSchedule has no Android dependencies. Test the exact production
  # Kotlin sources in their standalone JVM build instead of building the full
  # Flutter Android app and its plugins for four helper tests.
  app-runtime-jvm:
    name: "${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'PR metadata edit (JVM tests skipped)' || 'Application Runtime (Kotlin/JVM)' }}"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Test standalone scheduling module
        run: gradle -p android/keep_alive_schedule test

  # ── Functional test suites ────────────────────────────────────────────────
  test:
    name: "${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && format('PR metadata edit (tests skipped: {0})', matrix.label) || format('Tests ({0})', matrix.label) }}"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep functional ownership in the Dart runner and group related
          # suites here to reduce repeated Flutter setup while isolating UI.
          - label: External Components
            suite: component-integrations
          - label: Built-in Components
            suite: built-in-components
          - label: Chat and TaskFlow Core
            suite: chat-taskflow-core
          - label: Files and Data
            suite: files-data
          - label: Application and Shared
            suite: application-shared
          - label: Chat UI
            suite: chat-ai-ui
          - label: Other Feature UI
            suite: feature-ui
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        if: matrix.suite == 'application-shared' || matrix.suite == 'chat-ai-ui'
      - name: Expose test fixtures to Flutter Web's test server
        if: matrix.suite == 'application-shared' || matrix.suite == 'chat-ai-ui'
        run: ln -s tests test
      - name: Run ${{ matrix.label }} tests
        run: python3 tools/ci/run_flutter_test_suite.py "${{ matrix.suite }}"
      - name: Run Mermaid preview web controls regression
        if: matrix.suite == 'chat-ai-ui'
        run: flutter test --reporter expanded --platform chrome --plain-name 'renders clickable HTML controls above the fullscreen web preview' test/pages/chat/dialogs/mermaid_preview_dialog_zoom_test.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Run Web startup checks in Chrome
        if: matrix.suite == 'application-shared'
        run: flutter test --platform chrome test/startup/startup_check_service_web.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
