name: CI Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-js:
    name: Vendor JS (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Math editor bridge
            mathEditor: true
          - label: Mermaid fit retry behavior
            mermaid: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/math_editor_test/package-lock.json
      - run: npm ci --prefix tools/math_editor_test
        if: matrix.mathEditor == true
      - run: npm test --prefix tools/math_editor_test
        if: matrix.mathEditor == true
      - run: node --test tests/widgets/mermaid_render_widget_js_test.cjs
        if: matrix.mermaid == true

  # Keep the required branch-protection check name while sharing Flutter setup.
  quality:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        # Preserve the repo's Dart 3.0 formatting baseline after raising its SDK minimum.
        run: dart format --language-version=3.0 --set-exit-if-changed .
      - name: Run Dart analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Check changed files have tests
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "Not a PR — skipping diff coverage check."
            exit 0
          fi
          echo "### Changed lib/ files vs tests/ coverage ###"
          echo ""
          UNCOVERED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            test_f="tests/${file#lib/}"
            test_f="${test_f%.dart}_test.dart"
            if [ -f "$test_f" ]; then
              echo "  ✅ $file"
            else
              # Tests are sometimes grouped in a sub-directory of the mapped
              # path (e.g. tests/pages/<subdir>/x_test.dart). Look one level deep.
              dir=$(dirname "$test_f")
              base=$(basename "$test_f")
              if compgen -G "$dir/*/$base" >/dev/null; then
                echo "  ✅ $file ($(compgen -G "$dir/*/$base" | head -1))"
              else
                echo "  ⚠️  $file → missing $test_f"
                UNCOVERED=1
              fi
            fi
          done < <(git diff --diff-filter=ACMRT --name-only "$BASE_SHA" -- 'lib/*.dart' 'lib/**/*.dart')
          echo ""
          if [ "$UNCOVERED" -eq 0 ]; then
            echo "All changed files have matching tests. (But check that existing tests cover new logic.)"
          else
            echo "Some changed files lack matching tests. Add a test file or update the mapping for the test that covers it."
            exit 1
          fi

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: flutter pub get
      - name: Set Flutter SDK path for Gradle
        run: echo "flutter.sdk=$(dirname "$(dirname "$(command -v flutter)")")" > android/local.properties
      - name: Run watchdog scheduling regression test
        run: gradle -p android :app:testDebugUnitTest --tests com.johntsui.stroom.KeepAliveReceiverTest

  catcatch-js:
    name: CatCatch JavaScript boundary tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run CatCatch JavaScript hook tests
        run: node --test tests/catcatch/js_hook_script_test.cjs

  # This web-only target stays outside `_test.dart` discovery for VM groups.
  # Flutter's Web test server serves fixtures from tests/, which this job aliases.
  startup-web:
    name: Startup Web test
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - run: flutter pub get
      - name: Expose test fixtures to Flutter Web's test server
        run: ln -s tests test
      - name: Run Web startup checks in Chrome
        run: flutter test --platform chrome test/startup/startup_check_service_web.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}

  # ── Test Suite (parallel groups) ──────────────────────────────────────────
  test:
    name: Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Foundation
            pattern: tests/*_test.dart tests/models tests/providers tests/utils
          - label: Services-Startup
            pattern: tests/services tests/startup
          - label: Feature-Modules
            pattern: tests/task_flow tests/anki tests/catcatch
          - label: Pages
            pattern: tests/pages/*_test.dart tests/pages/unified_task_list tests/pages/settings tests/pages/ocr
          - label: Chat
            pattern: tests/pages/chat_page tests/pages/chat
          - label: Content-Widgets
            pattern: tests/pages/content tests/widgets
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Run ${{ matrix.label }} tests
        run: flutter test ${{ matrix.pattern }}
