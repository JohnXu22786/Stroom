name: CI Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-description:
    name: PR description format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci/requirements.txt
      - name: Install PR description validator dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/ci/requirements.txt
      - name: Test PR description validator
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Validate PR description
        run: python3 tools/ci/validate_pr_description.py "$GITHUB_EVENT_PATH"

  math-editor:
    name: Math editor bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/math_editor_test/package-lock.json
      - run: npm ci --prefix tools/math_editor_test
      - run: npm test --prefix tools/math_editor_test

  # ── Format Check ──────────────────────────────────────────────────────────
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        # Preserve the repo's Dart 3.0 formatting baseline after raising its SDK minimum.
        run: dart format --language-version=3.0 --set-exit-if-changed .

  # ── Static Analysis ───────────────────────────────────────────────────────
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Run Dart analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Check changed files have tests
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "Not a PR — skipping diff coverage check."
            exit 0
          fi
          echo "### Changed lib/ files vs tests/ coverage ###"
          echo ""
          UNCOVERED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            test_f="tests/${file#lib/}"
            test_f="${test_f%.dart}_test.dart"
            if [ -f "$test_f" ]; then
              echo "  ✅ $file"
            else
              # Tests are sometimes grouped in a sub-directory of the mapped
              # path (e.g. tests/pages/<subdir>/x_test.dart). Look one level deep.
              dir=$(dirname "$test_f")
              base=$(basename "$test_f")
              if compgen -G "$dir/*/$base" >/dev/null; then
                echo "  ✅ $file ($(compgen -G "$dir/*/$base" | head -1))"
              else
                echo "  ⚠️  $file → missing $test_f"
                UNCOVERED=1
              fi
            fi
          done < <(git diff --name-only "$BASE_SHA" -- 'lib/**/*.dart')
          echo ""
          if [ "$UNCOVERED" -eq 0 ]; then
            echo "All changed files have matching tests. (But check that existing tests cover new logic.)"
          else
            echo "Some changed files lack dedicated test files. Add them or verify coverage via existing tests."
          fi

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: flutter pub get
      - name: Set Flutter SDK path for Gradle
        run: echo "flutter.sdk=$(dirname "$(dirname "$(command -v flutter)")")" > android/local.properties
      - name: Run watchdog scheduling regression test
        run: gradle -p android :app:testDebugUnitTest --tests com.johntsui.stroom.KeepAliveReceiverTest

  # This web-only target stays outside `_test.dart` discovery for VM groups.
  # Flutter's Web test server serves fixtures from test/, which this job aliases.
  startup-web:
    name: Startup Web test
    runs-on: ubuntu-latest
    needs: [format, analyze]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - run: flutter pub get
      - name: Expose test fixtures to Flutter Web's test server
        run: ln -s tests test
      - name: Run Web startup checks in Chrome
        run: flutter test --platform chrome test/startup/startup_check_service_web.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}

  # ── Test Suite (parallel groups) ──────────────────────────────────────────
  test:
    name: Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: [format, analyze]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Core
            pattern: tests/*_test.dart
          - label: Anki
            pattern: tests/anki
          - label: Widgets
            pattern: tests/widgets
          - label: Pages
            pattern: tests/pages/*_test.dart tests/pages/unified_task_list
          - label: Pages-ChatPage
            pattern: tests/pages/chat_page
          - label: Pages-Settings
            pattern: tests/pages/settings
          - label: Pages-Content
            pattern: tests/pages/content
          - label: Pages-Chat
            pattern: tests/pages/chat
          - label: Providers
            pattern: tests/providers
          - label: Services
            pattern: tests/services
          - label: Utils
            pattern: tests/utils
          - label: Models
            pattern: tests/models
          - label: Startup
            pattern: tests/startup
          - label: TaskFlow
            pattern: tests/task_flow
          - label: CatCatch
            pattern: tests/catcatch
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Run ${{ matrix.label }} tests
        run: flutter test ${{ matrix.pattern }}
