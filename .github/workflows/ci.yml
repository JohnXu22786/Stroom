name: CI Checks

on:
  pull_request:
    branches: [main, v0.6]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # Let each pull request CI run finish independently.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # Small JavaScript checks for the integrated components share one Node job.
  components:
    name: "Component Integration scripts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - run: flutter pub get
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/widgets/mermaid_render_widget_js_test.cjs
      - run: node --test tests/catcatch/js_hook_script_test.cjs

  ocr-benchmark:
    name: "OCR Benchmark Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify OCR benchmark fixtures
        run: python3 tools/ocr_benchmark/evaluate.py --verify-fixtures
      - name: Test OCR benchmark evaluator
        run: python3 -m unittest discover -s tools/ocr_benchmark -p 'test_*.py' -v

  format:
    name: "Format Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Normalize and verify generated localization
        run: |
          dart format --language-version=3.0 lib/l10n/app_localizations.dart
          git diff --exit-code -- lib/l10n/app_localizations.dart
      - name: Check Dart formatting
        # Preserve the repo's Dart 3.0 formatting baseline after raising its SDK minimum.
        run: dart format --language-version=3.0 --set-exit-if-changed .

  # Keep the required branch-protection check name for static analysis.
  quality:
    name: "Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Run Dart analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Check changed files have tests
        run: |
          EVENT_BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$EVENT_BASE_SHA" ]; then
            echo "Not a PR — skipping diff coverage check."
            exit 0
          fi
          echo "### Changed lib/ files vs tests/ coverage ###"
          echo ""
          UNCOVERED=0
          # Pull request refs are normally merge commits. Their first parent
          # is the exact base used to build the ref, even when main advances
          # after the event payload was created. Use it to exclude upstream
          # changes; fall back to a merge-base for a plain head checkout or a
          # feature branch whose own history happens to contain a merge.
          PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if SECOND_PARENT_SHA="$(git rev-parse --verify HEAD^2 2>/dev/null)" && [ "$SECOND_PARENT_SHA" = "$PR_HEAD_SHA" ]; then
            if ! DIFF_BASE_SHA="$(git rev-parse HEAD^1)"; then
              echo "Unable to determine the merge ref base."
              exit 1
            fi
          elif ! DIFF_BASE_SHA="$(git merge-base "$EVENT_BASE_SHA" HEAD)"; then
            echo "Unable to determine the merge base against $EVENT_BASE_SHA."
            exit 1
          fi
          if ! CHANGED_LIB_FILES="$(git diff --diff-filter=ACMRT --name-only "$DIFF_BASE_SHA" HEAD -- 'lib/*.dart' 'lib/**/*.dart')"; then
            echo "Unable to determine changed lib files against $DIFF_BASE_SHA."
            exit 1
          fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              lib/l10n/app_localizations.dart|\
              lib/l10n/app_localizations_en.dart|\
              lib/l10n/app_localizations_zh.dart)
                test_f="tests/services/ocr_task_runner_test.dart"
                ;;
              lib/services/ocr_result_saver.dart)
                test_f="tests/services/ocr_task_runner_test.dart"
                ;;
              lib/pages/assistant/assistant_defaults_tab.dart|\
              lib/pages/assistant/assistant_shared.dart)
                test_f="tests/pages/assistant_pages_test.dart"
                ;;
              lib/pages/notification_settings_page.dart)
                test_f="tests/pages/settings/settings_page_test.dart"
                ;;
              lib/pages/ocr/ocr_instruction_dialog.dart)
                test_f="tests/pages/content/ocr_page_test.dart"
                ;;
              lib/catcatch/engine/js_hook_script.dart)
                test_f="tests/catcatch/js_hook_script_test.cjs"
                ;;
              lib/services/startup_preferences.dart)
                test_f="tests/startup/startup_check_service_web.dart"
                ;;
              lib/services/data_integrity_json_parser_web.dart)
                test_f="tests/startup/startup_check_service_web.dart"
                ;;
              lib/services/sse_client_web_error.dart|\
              lib/services/sse_client_io.dart)
                test_f="tests/services/sse_client_web_test.dart"
                ;;
              lib/pages/gallery_page.dart|\
              lib/pages/tts_page.dart|\
              lib/pages/video_gallery_page.dart|\
              lib/utils/file_picker_utils.dart)
                test_f="tests/utils/file_picker_utils_test.dart"
                ;;
              lib/pages/voice_editor_page.dart)
                test_f="tests/task_flow/tts_voice_save_propagation_test.dart"
                ;;
              lib/pages/voice_editor_shared.dart)
                test_f="tests/pages/voice_editor_shared_test.dart"
                ;;
              lib/pages/model_config_shared.dart)
                test_f="tests/pages/settings/provider_config_detail_page_test.dart"
                ;;
              lib/pages/provider_config_tool_dialogs.dart)
                test_f="tests/widgets/mcp_config_card_style_test.dart"
                ;;
              lib/widgets/version_info_dialog.dart)
                test_f="tests/pages/settings/settings_page_test.dart"
                ;;
              lib/pages/chat/dialogs/mermaid_preview_web_controls.dart|\
              lib/pages/chat/dialogs/mermaid_preview_web_controls_stub.dart|\
              lib/pages/chat/dialogs/mermaid_preview_web_controls_web.dart)
                test_f="tests/pages/chat/dialogs/mermaid_preview_dialog_zoom_test.dart"
                ;;
              *)
                test_f="tests/${file#lib/}"
                test_f="${test_f%.dart}_test.dart"
                ;;
            esac
            if [ -f "$test_f" ]; then
              echo "  ✅ $file"
            else
              # Tests are sometimes grouped in a sub-directory of the mapped
              # path (e.g. tests/pages/<subdir>/x_test.dart). Look one level deep.
              dir=$(dirname "$test_f")
              base=$(basename "$test_f")
              if compgen -G "$dir/*/$base" >/dev/null; then
                echo "  ✅ $file ($(compgen -G "$dir/*/$base" | head -1))"
              else
                # Older tests were flattened while their source files stayed
                # in feature directories (for example lib/models/assistant.dart
                # is covered by tests/assistant_test.dart). Accept that layout
                # only when the basename identifies exactly one test file;
                # ambiguous names must be added to the explicit map above.
                if [[ "$base" == *_test.dart ]]; then
                  stem="${base%_test.dart}"
                  mapfile -t flattened < <(
                    find tests -type f -name "${stem}_test.dart" -print
                  )
                else
                  # Non-Dart tests are accepted only by an explicit source map.
                  flattened=()
                fi
                if [ "${#flattened[@]}" -eq 1 ]; then
                  echo "  ✅ $file (${flattened[0]})"
                else
                  # Grouped or renamed tests may not share the source basename.
                  # A package import is explicit evidence that the test covers
                  # this source file, so accept all matching test files.
                  source_import="package:stroom/${file#lib/}"
                  mapfile -t imported_tests < <(
                  grep -RIlF --include='*_test.dart' --include='*_test.cjs' -- "$source_import" tests || true
                  )
                  if [ "${#imported_tests[@]}" -gt 0 ]; then
                    echo "  ✅ $file (imported by ${imported_tests[*]})"
                  else
                    # Dart parts are compiled through their parent library and
                    # therefore have no direct package import in test files.
                    part_of=$(sed -nE "s/^part of ['\"]([^'\"]+)['\"];$/\1/p" "$file" | head -1)
                    if [ -n "$part_of" ]; then
                      source_dir=$(dirname "${file#lib/}")
                      if [ "$source_dir" = "." ]; then
                        parent_import="package:stroom/$part_of"
                      else
                        parent_import="package:stroom/$source_dir/$part_of"
                      fi
                      mapfile -t parent_tests < <(
                        grep -RIlF --include='*_test.dart' --include='*_test.cjs' -- "$parent_import" tests || true
                      )
                    else
                      parent_tests=()
                    fi
                    if [ "${#parent_tests[@]}" -gt 0 ]; then
                      echo "  ✅ $file (parent library imported by ${parent_tests[*]})"
                    else
                      echo "  ⚠️  $file → missing $test_f"
                      if [ "${#flattened[@]}" -gt 1 ]; then
                        printf '      Ambiguous basename matches: %s\n' "${flattened[*]}"
                      fi
                      UNCOVERED=1
                    fi
                  fi
                fi
              fi
            fi
          done <<< "$CHANGED_LIB_FILES"
          echo ""
          if [ "$UNCOVERED" -eq 0 ]; then
            echo "All changed files have matching tests. (But check that existing tests cover new logic.)"
          else
            echo "Some changed files lack matching tests. Add a test file or update the mapping for the test that covers it."
            exit 1
          fi

  # KeepAliveSchedule has no Android dependencies. Test the exact production
  # Kotlin sources in their standalone JVM build instead of building the full
  # Flutter Android app and its plugins for four helper tests.
  app-runtime-jvm:
    name: "Application Runtime (Kotlin/JVM)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Test standalone scheduling module
        run: gradle -p android/keep_alive_schedule test

  # Native Zed keychain readers are compiled for each desktop OS. Keep these
  # checks in the manual/PR workflow so platform bridges cannot drift unbuilt.
  macos-desktop-build:
    name: macOS desktop build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Build macOS desktop application
        run: flutter build macos --debug

  linux-desktop-build:
    name: Linux desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Build Linux desktop application
        run: flutter build linux --debug

  windows-desktop-build:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Build Windows desktop application
        run: flutter build windows --debug

  # This web-only target stays outside `_test.dart` discovery for VM groups.
  # Flutter's Web test server serves fixtures from test/, which this job aliases.
  startup-web:
    name: Startup Web test
    runs-on: ubuntu-latest
    needs: [format, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Install native asset build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      - run: flutter pub get
      - name: Expose test fixtures to Flutter Web's test server
        run: ln -s tests test
      - name: Run Web startup checks in Chrome
        run: flutter test --platform chrome test/startup/startup_check_service_web.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}

  # ── Test Suite (parallel groups) ──────────────────────────────────────────
  test:
    name: "Tests (${{ matrix.label }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep functional ownership in the Dart runner and group related
          # suites here to reduce repeated Flutter setup while isolating UI.
          - label: External Components
            suite: component-integrations
          - label: Built-in Components
            suite: built-in-components
          - label: Chat and TaskFlow Core
            suite: chat-taskflow-core
          - label: Files and Data
            suite: files-data
          - label: Application and Shared
            suite: application-shared
          - label: Chat UI
            suite: chat-ai-ui
          - label: Other Feature UI
            suite: feature-ui
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true
          pub-cache: true
      - name: Install native asset build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      - run: flutter pub get
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        if: matrix.suite == 'application-shared' || matrix.suite == 'chat-ai-ui'
      - name: Expose test fixtures to Flutter Web's test server
        if: matrix.suite == 'application-shared' || matrix.suite == 'chat-ai-ui'
        run: ln -s tests test
      - name: Run ${{ matrix.label }} tests
        run: python3 tools/ci/run_flutter_test_suite.py "${{ matrix.suite }}"
      - name: Run Mermaid preview web controls regression
        if: matrix.suite == 'chat-ai-ui'
        run: flutter test --reporter expanded --platform chrome --plain-name 'renders clickable HTML controls above the fullscreen web preview' test/pages/chat/dialogs/mermaid_preview_dialog_zoom_test.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Run Mermaid preview loading regressions in Chrome
        if: matrix.suite == 'chat-ai-ui'
        run: flutter test --reporter expanded --platform chrome test/pages/chat/dialogs/mermaid_preview_dialog_test.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Run Mermaid WebView stale load-stop regression in Chrome
        if: matrix.suite == 'chat-ai-ui'
        run: flutter test --reporter expanded --platform chrome --plain-name 'web source updates keep queued zoom until current load completes' test/widgets/mermaid_render_widget_test.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Run Mermaid queued zoom timestamp regression in Chrome
        if: matrix.suite == 'chat-ai-ui'
        run: flutter test --reporter expanded --platform chrome --plain-name 'zoom tapped while loading is applied after WebView readiness' test/widgets/mermaid_render_widget_test.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Run Mermaid inline overlay pointer regression in Chrome
        if: matrix.suite == 'chat-ai-ui'
        run: flutter test --reporter expanded --platform chrome --plain-name 'MermaidRenderWidget - web overlay pointer routing' test/widgets/mermaid_render_widget_test.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Run Web startup checks in Chrome
        if: matrix.suite == 'application-shared'
        run: flutter test --platform chrome test/startup/startup_check_service_web.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
