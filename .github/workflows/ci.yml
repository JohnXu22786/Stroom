name: CI Checks

on:
  pull_request:
    branches: [main, 'v*', 'release/*']
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-description:
    name: PR description format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci/requirements.txt
      - name: Install PR description validator dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/ci/requirements.txt
      - name: Test PR description validator
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Validate PR description
        run: python3 tools/ci/validate_pr_description.py "$GITHUB_EVENT_PATH"

  math-editor:
    name: Math editor bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/math_editor_test/package-lock.json
      - run: npm ci --prefix tools/math_editor_test
      - run: npm test --prefix tools/math_editor_test

  dsh-message-view:
    name: DSH message renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/message_renderer/package-lock.json
      - run: npm ci --prefix tools/message_renderer
      - run: npm test --prefix tools/message_renderer
      - name: Verify bundled assets are current
        run: git diff --exit-code -- assets/vendor/dsh_message_view

  message-platform-linux:
    name: Message view Linux build and smoke test
    runs-on: ubuntu-24.04
    # WPE WebKit's bubblewrap sandbox requires these permissions inside Docker.
    container:
      image: debian:trixie
      options: --cap-add=SYS_ADMIN --cap-add=NET_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - name: Install Linux WebView dependencies
        run: |
          apt-get update -y
          apt-get install -y ca-certificates curl git jq unzip xz-utils zstd xvfb clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libayatana-appindicator3-dev libwpewebkit-2.0-dev libwpebackend-fdo-1.0-dev libepoxy-dev libsecret-1-dev
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - name: Trust the restored Flutter SDK in the container
        run: git config --global --add safe.directory "$FLUTTER_ROOT"
      - run: flutter pub get
      - run: flutter build linux --release
      - run: xvfb-run flutter test -d linux integration_test/message_view_smoke_test.dart --reporter expanded

  message-platform-web:
    name: Message view Web build and smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-chromedriver: true
      - name: Run browser-driven Web message view smoke test
        run: |
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --port=4444 > /tmp/chromedriver.log 2>&1 &
          chromedriver_pid=$!
          trap 'kill "$chromedriver_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4444/status >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4444/status >/dev/null || { cat /tmp/chromedriver.log; exit 1; }
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/message_view_smoke_test.dart -d web-server --browser-name=chrome --chrome-binary="${{ steps.setup-chrome.outputs.chrome-path }}" --driver-port=4444

  message-platform-android:
    name: Message view Android build and smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Build Android APK
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/android-build.log"
          flutter build apk --debug 2>&1 | tee "$log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            details="$(tail -n 30 "$log" | tr '\r\n' ' ' | sed 's/%/%25/g')"
            printf '::error title=Android build details::%s\n' "$details"
          fi
          exit "$result"
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            set +e
            log="$GITHUB_WORKSPACE/android-message-smoke.log"
            flutter test -d emulator-5554 integration_test/message_view_smoke_test.dart --reporter expanded 2>&1 | tee "$log"
            result=${PIPESTATUS[0]}
            exit "$result"
      - name: Summarize Android smoke failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### Android message smoke failure details'
            if [ -f "$GITHUB_WORKSPACE/android-message-smoke.log" ]; then
              echo '```text'
              tail -n 100 "$GITHUB_WORKSPACE/android-message-smoke.log"
              echo '```'
              details="$(tail -n 40 "$GITHUB_WORKSPACE/android-message-smoke.log" | tr '\r\n' ' ' | sed 's/%/%25/g' | cut -c1-12000)"
            else
              echo 'The emulator action failed before the smoke-test script created its log.'
              details="The emulator action failed before the smoke-test script created its log."
            fi
            "$ANDROID_HOME/platform-tools/adb" devices -l || true
          } >> "$GITHUB_STEP_SUMMARY"
          printf '::error title=Android smoke failure details::%s\n' "$details"

  message-platform-windows:
    name: Message view Windows build and smoke test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - run: flutter test -d windows integration_test/message_view_smoke_test.dart --reporter expanded

  message-platform-macos:
    name: Message view macOS build and smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Build macOS app
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/macos-build.log"
          flutter build macos --release 2>&1 | tee "$log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            details="$(tail -n 30 "$log" | tr '\r\n' ' ' | sed 's/%/%25/g')"
            printf '::error title=macOS build details::%s\n' "$details"
          fi
          exit "$result"
      - name: Run macOS message view smoke test
        timeout-minutes: 10
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/macos-message-smoke.log"
          (
            set -o pipefail
            flutter test -d macos integration_test/message_view_smoke_test.dart --reporter expanded 2>&1 | tee "$log"
          ) &
          test_pid=$!
          for _ in $(seq 1 400); do
            if grep -q 'Failed to foreground app; open returned 1' "$log" 2>/dev/null; then
              app="$(find build/macos/Build/Products/Debug -maxdepth 1 -name '*.app' -print -quit)"
              if [ -n "$app" ]; then
                for _ in $(seq 1 8); do
                  open "$app" && break
                  sleep 0.1
                done
              fi
              break
            fi
            kill -0 "$test_pid" 2>/dev/null || break
            sleep 0.05
          done
          wait "$test_pid"
          result=$?
          exit "$result"
      - name: Summarize macOS smoke failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### macOS message smoke failure details'
            if [ -f "$RUNNER_TEMP/macos-message-smoke.log" ]; then
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/macos-message-smoke.log"
              echo '```'
              details="$(tail -n 40 "$RUNNER_TEMP/macos-message-smoke.log" | tr '\r\n' ' ' | sed 's/%/%25/g' | cut -c1-12000)"
            else
              echo 'The smoke-test step did not create its log.'
              details='The smoke-test step did not create its log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf '::error title=macOS smoke failure details::%s\n' "$details"

  message-platform-ios:
    name: Message view iOS simulator build and smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --no-codesign
      - name: Boot an available iOS simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime, devices in data["devices"].items() if "iOS" in runtime for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          simulator_state="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["state"] for runtime, devices in data["devices"].items() if "iOS" in runtime for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          if [ "$simulator_state" != "Booted" ]; then
            xcrun simctl boot "$simulator_id"
          fi
          xcrun simctl bootstatus "$simulator_id" -b
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Run iOS message view smoke test
        timeout-minutes: 20
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/ios-message-smoke.log"
          flutter test -d "$IOS_SIMULATOR_ID" integration_test/message_view_smoke_test.dart --reporter expanded 2>&1 | tee "$log"
          result=${PIPESTATUS[0]}
          exit "$result"
      - name: Summarize iOS smoke failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### iOS message smoke failure details'
            if [ -f "$RUNNER_TEMP/ios-message-smoke.log" ]; then
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/ios-message-smoke.log"
              echo '```'
              details="$(tail -n 40 "$RUNNER_TEMP/ios-message-smoke.log" | tr '\r\n' ' ' | sed 's/%/%25/g' | cut -c1-12000)"
            else
              echo 'The smoke-test step did not create its log.'
              details='The smoke-test step did not create its log.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf '::error title=iOS smoke failure details::%s\n' "$details"

  # ── Format Check ──────────────────────────────────────────────────────────
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        # Preserve the repo's Dart 3.0 formatting baseline after raising its SDK minimum.
        run: dart format --language-version=3.0 --set-exit-if-changed .

  # ── Static Analysis ───────────────────────────────────────────────────────
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Run Dart analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Check changed files have tests
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "Not a PR — skipping diff coverage check."
            exit 0
          fi
          echo "### Changed lib/ files vs tests/ coverage ###"
          echo ""
          UNCOVERED=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            test_f="tests/${file#lib/}"
            test_f="${test_f%.dart}_test.dart"
            if [ -f "$test_f" ]; then
              echo "  ✅ $file"
            else
              # Tests are sometimes grouped in a sub-directory of the mapped
              # path (e.g. tests/pages/<subdir>/x_test.dart). Look one level deep.
              dir=$(dirname "$test_f")
              base=$(basename "$test_f")
              if compgen -G "$dir/*/$base" >/dev/null; then
                echo "  ✅ $file ($(compgen -G "$dir/*/$base" | head -1))"
              else
                echo "  ⚠️  $file → missing $test_f"
                UNCOVERED=1
              fi
            fi
          done < <(git diff --name-only "$BASE_SHA" -- 'lib/**/*.dart')
          echo ""
          if [ "$UNCOVERED" -eq 0 ]; then
            echo "All changed files have matching tests. (But check that existing tests cover new logic.)"
          else
            echo "Some changed files lack dedicated test files. Add them or verify coverage via existing tests."
          fi

  android-unit:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: flutter pub get
      - name: Set Flutter SDK path for Gradle
        run: echo "flutter.sdk=$(dirname "$(dirname "$(command -v flutter)")")" > android/local.properties
      - name: Run watchdog scheduling regression test
        run: gradle -p android :app:testDebugUnitTest --tests com.johntsui.stroom.KeepAliveReceiverTest

  # ── Test Suite (parallel groups) ──────────────────────────────────────────
  test:
    name: Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: [format, analyze]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Core
            pattern: tests/*_test.dart
          - label: Anki
            pattern: tests/anki
          - label: Widgets
            pattern: tests/widgets
          - label: Pages
            pattern: tests/pages/*_test.dart tests/pages/unified_task_list
          - label: Pages-ChatPage
            pattern: tests/pages/chat_page
          - label: Pages-Settings
            pattern: tests/pages/settings
          - label: Pages-Content
            pattern: tests/pages/content
          - label: Pages-Chat
            pattern: tests/pages/chat
          - label: Providers
            pattern: tests/providers
          - label: Services
            pattern: tests/services
          - label: Utils
            pattern: tests/utils
          - label: Models
            pattern: tests/models
          - label: Startup
            pattern: tests/startup
          - label: TaskFlow
            pattern: tests/task_flow
          - label: CatCatch
            pattern: tests/catcatch
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Run ${{ matrix.label }} tests
        run: flutter test ${{ matrix.pattern }}
