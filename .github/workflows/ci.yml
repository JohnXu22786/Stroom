name: CI Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  # Keep metadata-only edits out of the code workflow's pending slot. This
  # preserves a queued run for a commit or base-branch retarget.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'code' }}
  # A title/body-only edit gets its own short validation workflow and must not
  # cancel a code run. Retargeting a PR changes `changes.base` and still
  # cancels the prior run so the new base is checked.
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}

jobs:
  vendor-js:
    # A title/body-only edit keeps the same head SHA. Its skipped check uses a
    # distinct name so it cannot overwrite the formal result for that SHA;
    # base-branch edits keep the normal name and execute the code checks.
    name: "${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && format('PR metadata edit (vendor skipped: {0})', matrix.label) || format('Vendor JS ({0})', matrix.label) }}"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Math editor bridge
            mathEditor: true
          - label: Mermaid fit retry behavior
            mermaid: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/math_editor_test/package-lock.json
      - run: npm ci --prefix tools/math_editor_test
        if: matrix.mathEditor == true
      - run: npm test --prefix tools/math_editor_test
        if: matrix.mathEditor == true
      - run: node --test tests/widgets/mermaid_render_widget_js_test.cjs
        if: matrix.mermaid == true

  # Keep the required branch-protection check name while sharing Flutter setup.
  quality:
    # The prior Static Analysis result remains attached to the unchanged head
    # SHA during metadata-only edits; base retargets use this formal name.
    name: "${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'PR metadata edit (code checks skipped)' || 'Static Analysis' }}"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        # Preserve the repo's Dart 3.0 formatting baseline after raising its SDK minimum.
        run: dart format --language-version=3.0 --set-exit-if-changed .
      - name: Run Dart analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Check changed files have tests
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            echo "Not a PR — skipping diff coverage check."
            exit 0
          fi
          echo "### Changed lib/ files vs tests/ coverage ###"
          echo ""
          UNCOVERED=0
          if ! CHANGED_LIB_FILES="$(git diff --diff-filter=ACMRT --name-only "$BASE_SHA" -- 'lib/*.dart' 'lib/**/*.dart')"; then
            echo "Unable to determine changed lib files against $BASE_SHA."
            exit 1
          fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              lib/catcatch/engine/js_hook_script.dart)
                test_f="tests/catcatch/js_hook_script_test.cjs"
                ;;
              *)
                test_f="tests/${file#lib/}"
                test_f="${test_f%.dart}_test.dart"
                ;;
            esac
            if [ -f "$test_f" ]; then
              echo "  ✅ $file"
            else
              # Tests are sometimes grouped in a sub-directory of the mapped
              # path (e.g. tests/pages/<subdir>/x_test.dart). Look one level deep.
              dir=$(dirname "$test_f")
              base=$(basename "$test_f")
              if compgen -G "$dir/*/$base" >/dev/null; then
                echo "  ✅ $file ($(compgen -G "$dir/*/$base" | head -1))"
              else
                # Older tests were flattened while their source files stayed
                # in feature directories (for example lib/models/assistant.dart
                # is covered by tests/assistant_test.dart). Accept that layout
                # only when the basename identifies exactly one test file;
                # ambiguous names must be added to the explicit map above.
                if [[ "$base" == *_test.dart ]]; then
                  stem="${base%_test.dart}"
                  mapfile -t flattened < <(
                    find tests -type f -name "${stem}_test.dart" -print
                  )
                else
                  # Non-Dart tests are accepted only by an explicit source map.
                  flattened=()
                fi
                if [ "${#flattened[@]}" -eq 1 ]; then
                  echo "  ✅ $file (${flattened[0]})"
                else
                  # Grouped or renamed tests may not share the source basename.
                  # A package import is explicit evidence that the test covers
                  # this source file, so accept all matching test files.
                  source_import="package:stroom/${file#lib/}"
                  mapfile -t imported_tests < <(
                    rg -l --glob '*_test.dart' --glob '*_test.cjs' -F "$source_import" tests || true
                  )
                  if [ "${#imported_tests[@]}" -gt 0 ]; then
                    echo "  ✅ $file (imported by ${imported_tests[*]})"
                  else
                    echo "  ⚠️  $file → missing $test_f"
                    if [ "${#flattened[@]}" -gt 1 ]; then
                      printf '      Ambiguous basename matches: %s\n' "${flattened[*]}"
                    fi
                    UNCOVERED=1
                  fi
                fi
              fi
            fi
          done <<< "$CHANGED_LIB_FILES"
          echo ""
          if [ "$UNCOVERED" -eq 0 ]; then
            echo "All changed files have matching tests. (But check that existing tests cover new logic.)"
          else
            echo "Some changed files lack matching tests. Add a test file or update the mapping for the test that covers it."
            exit 1
          fi

  android-unit:
    name: "${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'PR metadata edit (Android tests skipped)' || 'Android unit tests' }}"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: flutter pub get
      - name: Set Flutter SDK path for Gradle
        run: echo "flutter.sdk=$(dirname "$(dirname "$(command -v flutter)")")" > android/local.properties
      - name: Run watchdog scheduling regression test
        run: gradle -p android :app:testDebugUnitTest --tests com.johntsui.stroom.KeepAliveReceiverTest

  catcatch-js:
    name: "${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'PR metadata edit (CatCatch JS skipped)' || 'CatCatch JavaScript boundary tests' }}"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run CatCatch JavaScript hook tests
        run: node --test tests/catcatch/js_hook_script_test.cjs

  # This web-only target stays outside `_test.dart` discovery for VM groups.
  # Flutter's Web test server serves fixtures from tests/, which this job aliases.
  startup-web:
    name: "${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && 'PR metadata edit (startup web skipped)' || 'Startup Web test' }}"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - run: flutter pub get
      - name: Expose test fixtures to Flutter Web's test server
        run: ln -s tests test
      - name: Run Web startup checks in Chrome
        run: flutter test --platform chrome test/startup/startup_check_service_web.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}

  # ── Test Suite (parallel groups) ──────────────────────────────────────────
  test:
    name: "${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null && format('PR metadata edit (tests skipped: {0})', matrix.label) || format('Tests ({0})', matrix.label) }}"
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    runs-on: ubuntu-latest
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Foundation
            pattern: tests/*_test.dart tests/models tests/providers tests/utils
          - label: Services-Startup
            pattern: tests/services tests/startup
          - label: Feature-Modules
            pattern: tests/task_flow tests/anki tests/catcatch
          - label: Pages
            pattern: tests/pages/*_test.dart tests/pages/unified_task_list tests/pages/settings tests/pages/ocr
          - label: Chat
            pattern: tests/pages/chat_page tests/pages/chat
          - label: Content-Widgets
            pattern: tests/pages/content tests/widgets
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Run ${{ matrix.label }} tests
        run: flutter test ${{ matrix.pattern }}
